# Solo demostracion local de Arquitectura. No usar en produccion.
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: arquitectura_demo
      POSTGRES_USER: arquitectura_demo
      POSTGRES_PASSWORD: ${ARQ_POSTGRES_PASSWORD:?Ejecuta Iniciar_Arquitectura.ps1}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arquitectura_demo -d arquitectura_demo"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongodb:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: arquitectura_demo
      MONGO_INITDB_ROOT_PASSWORD: ${ARQ_MONGO_PASSWORD:?Ejecuta Iniciar_Arquitectura.ps1}
      MONGO_INITDB_DATABASE: arquitectura_demo
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 25
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8035:8025"
  backend:
    build: ./backend
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8010:8000"
    environment: &demo_env
      DEBUG: "1"
      SECRET_KEY: ${ARQ_SECRET_KEY:?Ejecuta Iniciar_Arquitectura.ps1}
      PAYMENT_CREDENTIALS_KEY: ${ARQ_PAYMENT_KEY:?Ejecuta Iniciar_Arquitectura.ps1}
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,backend,testserver"
      DJANGO_CORS_ALLOWED_ORIGINS: "http://127.0.0.1:5183"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://127.0.0.1:5183"
      DJANGO_SECURE_SSL_REDIRECT: "0"
      DJANGO_SECURE_HSTS_SECONDS: "0"
      DB_NAME: arquitectura_demo
      DB_USER: arquitectura_demo
      DB_PASSWORD: ${ARQ_POSTGRES_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_USER: arquitectura_demo
      MONGO_PASSWORD: ${ARQ_MONGO_PASSWORD}
      MONGO_DB_NAME: arquitectura_demo
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "0"
      EMAIL_USE_SSL: "0"
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      DEFAULT_FROM_EMAIL: "EcoCrespo Demo <demo@example.test>"
      STORE_MAIL_EXTERNAL_ENABLED: "0"
      STORE_MAIL_TRANSPORT: mailpit
      STORE_MAIL_PUBLIC_API_URL: "http://127.0.0.1:8010"
      STOREFRONT_PUBLIC_URL: "http://127.0.0.1:5183/plantilla/2"
      COMMERCIAL_CONSENT_FRONTEND_ORIGIN: "http://127.0.0.1:5183"
      INSTAGRAM_PUBLISHING_ENABLED: "0"
    depends_on:
      db:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      mailpit:
        condition: service_started
  expirador_pedidos:
    build: ./backend
    command: ["python", "manage.py", "expirar_pedidos_pendientes", "--daemon", "--intervalo", "300"]
    volumes:
      - ./backend:/app
    environment: *demo_env
    depends_on:
      backend:
        condition: service_started
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: "http://127.0.0.1:8010"
      VITE_GOOGLE_CLIENT_ID: ""
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5183:5173"
    depends_on:
      - backend
volumes:
  postgres_data:
  mongo_data:
  frontend_node_modules:
